name: PBRP Builder (Max Speed)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'android-11.0'
        type: choice
        options: [android-12.1, android-11.0]
      USE_TWRPDTGEN:
        description: 'Use twrpdtgen?'
        required: true
        type: boolean
        default: true
      IMAGE_URL:
        description: 'Stock image URL (twrpdtgen only)'
        required: false
        default: 'https://drive.google.com/file/d/1DRIzOP1YfPn4qTjr3n_GJRQlmoN1yjBa/view?usp=drivesdk'
      DEVICE_TREE:
        description: 'Device tree repo (manual only)'
        required: false
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: false
        default: 'Android-11'
      DEVICE_PATH:
        description: 'Device path (e.g. device/samsung/gtowifi)'
        required: true
        default: 'device/samsung/gtowifi'
      DEVICE_NAME:
        description: 'Codename (e.g. gtowifi)'
        required: true
        default: 'gtowifi'
      ANDROID_VERSION:
        description: 'Android version'
        required: true
        default: '11'
        type: choice
        options: ['14', '13', '12', '11', '10']
      SCREEN_RESOLUTION:
        description: 'Resolution WxH'
        required: true
        default: '1200x800'
      KERNEL_TREE:
        description: 'Kernel repo (optional)'
        required: false
        default: ''
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: false
        default: ''
      KERNEL_PATH:
        description: 'Kernel path'
        required: false
        default: ''
      ENABLE_SCCACHE:
        description: 'Enable sccache?'
        required: true
        type: boolean
        default: true
      IS_AB_DEVICE:
        description: 'A/B device?'
        required: true
        type: boolean
        default: false
      EXTRA_BUILD_FLAGS:
        description: 'Extra BoardConfig.mk flags'
        required: false
        default: |
          TW_NO_TOUCH_WAIT_FOR_QCOM := true
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]
      LDCHECK:
        description: 'LDCheck blob path (blank=skip)'
        required: false
        default: ''

jobs:
  build:
    name: PBRP ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions: { contents: write }
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      BUILD_DATE: ${{ github.run_id }}
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v4

    - uses: rokibhasansagar/slimhub_actions@main

    - uses: pierotofy/set-swap-space@master
      with: { swap-size-gb: 32 }

    - name: Prepare environment
      run: |
        sudo apt update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt install -yqq \
          linux-modules-extra-$(uname -r) python3-pip cpio lz4 unzip gperf \
          gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev \
          lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential \
          libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libncurses6 python3 tar
        sudo ln -sf /usr/bin/python3 /usr/bin/python2
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ inputs.ANDROID_VERSION == '14' && '17' || '11' }}

    - name: Cache repo
      uses: actions/cache@v4
      with:
        path: ~/.cache/repo
        key: repo-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}
        restore-keys: |
          repo-${{ inputs.MANIFEST_BRANCH }}-

    - name: Init + sync (fallback)
      run: |
        mkdir android-recovery && cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        export GIT_TERMINAL_PROMPT=0
        repo init --depth=1 --partial-clone --clone-filter=blob:limit=10M --no-use-superproject \
          -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git \
          -b ${{ inputs.MANIFEST_BRANCH }}

        if repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (all threads)"
        elif repo sync -c -j2 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j2)"
        elif repo sync -c -j1 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j1)"
        else
          echo "SYNC FAILED: all attempts exhausted"
          exit 1
        fi

    - name: Clone device tree (manual)
      if: ${{ fromJSON(inputs.USE_TWRPDTGEN) == false }}
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.DEVICE_PATH }})
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

    - name: Generate tree (twrpdtgen)
      if: ${{ fromJSON(inputs.USE_TWRPDTGEN) == true }}
      run: |
        sudo pip3 install -q twrpdtgen gdown
        [[ "${{ inputs.IMAGE_URL }}" == *"drive.google.com"* ]] \
          && gdown "${{ inputs.IMAGE_URL }}" -O stock.img \
          || wget -q "${{ inputs.IMAGE_URL }}" -O stock.img
        python3 -m twrpdtgen stock.img -o generated_dt
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; | head -1)
        [ -z "$TREE" ] && { echo "twrpdtgen failed"; exit 1; }
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/
        echo "COMMIT_ID=Generated-by-twrpdtgen" >> $GITHUB_ENV

    - name: Fix device tree & patch BoardConfig
      env: { FLAGS: '${{ inputs.EXTRA_BUILD_FLAGS }}' }
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}
        find . -name "*.mk" -exec sed -i 's|vendor/omni/config/common.mk|vendor/pb/config/common.mk|g' {} +
        [ -f vendorsetup.sh ] && rm -f vendorsetup.sh
        MK=$(find . -maxdepth 1 -name "*_${{ inputs.DEVICE_NAME }}.mk" ! -name AndroidProducts.mk | head -1)
        if [ -n "$MK" ]; then
          PREFIX=$(basename "$MK" | sed "s/_${{ inputs.DEVICE_NAME }}\.mk//")
          grep -q "COMMON_LUNCH_CHOICES" AndroidProducts.mk || echo "COMMON_LUNCH_CHOICES := ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng" >> AndroidProducts.mk
        fi
        {
          echo "# --- Injected ---"
          echo "PLATFORM_VERSION := ${{ inputs.ANDROID_VERSION }}"
          [ -n "${{ inputs.SCREEN_RESOLUTION }}" ] && {
            echo "TARGET_SCREEN_WIDTH := $(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f1)"
            echo "TARGET_SCREEN_HEIGHT := $(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f2)"
          }
          [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && {
            echo "BOARD_BUILD_SYSTEMROOT_IMAGE := true"
            echo "AB_OTA_UPDATER := true"
          }
          [ -n "$FLAGS" ] && printf '%s\n' "$FLAGS"
        } >> BoardConfig.mk

    - name: Clone kernel (optional)
      if: inputs.KERNEL_TREE != ''
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.KERNEL_PATH }})
        git clone ${{ inputs.KERNEL_TREE }} -b ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_PATH }} --depth=1

    - name: Setup sccache
      if: ${{ fromJSON(inputs.ENABLE_SCCACHE) == true }}
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        variant: sccache
        max-size: 10G
        key: sccache-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}
        restore-keys: |
          sccache-${{ inputs.DEVICE_NAME }}-

    - name: Link ccache to sccache
      if: ${{ fromJSON(inputs.ENABLE_SCCACHE) == true }}
      run: |
        SCCACHE_PATH=$(which sccache)
        sudo mkdir -p /usr/lib/ccache
        sudo ln -sf "$SCCACHE_PATH" /usr/lib/ccache/ccache
        sudo ln -sf "$SCCACHE_PATH" /usr/lib/ccache/gcc
        sudo ln -sf "$SCCACHE_PATH" /usr/lib/ccache/g++
        echo "Symlinked ccache/gcc/g++ -> sccache"

    - name: Build (max speed)
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ "${{ fromJSON(inputs.ENABLE_SCCACHE) }}" = "true" ]; then
          export USE_CCACHE=1
          export SCCACHE_DIR=$HOME/.cache/sccache
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          export PATH="/usr/lib/ccache:$PATH"
        fi
        MK=$(find ${{ inputs.DEVICE_PATH }} -maxdepth 1 -name "*_${{ inputs.DEVICE_NAME }}.mk" ! -name AndroidProducts.mk | head -1)
        PREFIX=$(basename "$MK" | sed "s/_${{ inputs.DEVICE_NAME }}\.mk//")
        lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka -j$(nproc --all) pbrp

    - name: Verify output
      run: |
        cd $OUT
        F=${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
        [ -s "$F" ] || { echo "Missing/empty: $F"; exit 1; }

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: log-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/error*.log
          android-recovery/out/verbose.log
        retention-days: 7

    - uses: actions/upload-artifact@v4
      with:
        name: PBRP-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/PBRP*.zip
        retention-days: 3

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/PBRP*.zip
        name: PBRP ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: pbrp-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        fail_on_unmatched_files: false
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Tree: ${{ inputs.USE_TWRPDTGEN == 'true' && 'twrpdtgen' || 'Manual' }}

    - name: Summary
      if: always()
      run: |
        {
          echo "### PBRP Build (Max Speed)"
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Device | ${{ inputs.DEVICE_NAME }} |"
          echo "| Manifest | ${{ inputs.MANIFEST_BRANCH }} |"
          echo "| Target | ${{ inputs.BUILD_TARGET }} |"
          echo "| A/B | ${{ inputs.IS_AB_DEVICE }} |"
          echo "| Status | ${{ job.status }} |"
        } >> $GITHUB_STEP_SUMMARY
