name: Recovery Builder (TWRP / PBRP / SHRP / OFRP)

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Recovery Type'
        required: true
        default: 'twrp'
        type: choice
        options: [twrp, pbrp, shrp, ofrp]
      MANIFEST_BRANCH:
        description: 'Manifest Branch (version)'
        required: true
        default: '12.1'
        type: choice
        options: ['14.1', '13.0', '12.1', '11.0', '10.0', '9.0']
      TREE_GENERATOR:
        description: 'Tree Generator'
        required: true
        default: 'manual'
        type: choice
        options: [manual, twrpdtgen, aospdtgen]
      ANDROID_VERSION:
        description: 'Target Android Version'
        required: true
        default: '12'
        type: choice
        options: ['16', '15', '14', '13', '12', '11', '10', '9']
      IMAGE_URL:
        description: 'boot/recovery.img URL (twrpdtgen only)'
        required: false
        default: ''
      FIRMWARE_URL:
        description: 'Full firmware URL (aospdtgen only)'
        required: false
        default: ''
      DEVICE_TREE:
        description: 'Device tree repo (manual only)'
        required: false
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: false
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device path'
        required: true
        default: 'device/samsung/gtowifi'
      DEVICE_NAME:
        description: 'Codename'
        required: true
        default: 'gtowifi'
      SCREEN_RESOLUTION:
        description: 'Resolution WxH'
        required: true
        default: '1200x800'
      KERNEL_TREE:
        description: 'Kernel repo (optional)'
        required: false
        default: ''
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: false
        default: ''
      KERNEL_PATH:
        description: 'Kernel path'
        required: false
        default: ''
      ENABLE_SCCACHE:
        description: 'Enable sccache?'
        required: true
        type: boolean
        default: true
      IS_AB_DEVICE:
        description: 'A/B device?'
        required: true
        type: boolean
        default: false
      EXTRA_BUILD_FLAGS:
        description: 'Extra BoardConfig.mk flags (manual, one per line)'
        required: false
        default: ''
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]
      LDCHECK:
        description: 'LDCheck blob path (blank=skip)'
        required: false
        default: ''

jobs:
  build:
    name: ${{ inputs.RECOVERY_TYPE }} ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions: { contents: write }
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      BUILD_DATE: ${{ github.run_id }}
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v5

    - uses: rokibhasansagar/slimhub_actions@main

    - uses: pierotofy/set-swap-space@master
      with: { swap-size-gb: 32 }

    - name: Prepare environment
      run: |
        sudo apt update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt install -yqq \
          linux-modules-extra-$(uname -r) python3-pip cpio lz4 unzip gperf \
          gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev \
          lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential \
          libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libncurses6 python3 tar erofs-utils
        sudo ln -sf /usr/bin/python3 /usr/bin/python2
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: ${{ (inputs.ANDROID_VERSION == '14' || inputs.ANDROID_VERSION == '15' || inputs.ANDROID_VERSION == '16') && '17' || '11' }}

    # ============================================================
    # INIT + SYNC (repo-based: TWRP / PBRP / SHRP)
    # ============================================================
    - name: Init + sync (repo-based)
      if: inputs.RECOVERY_TYPE != 'ofrp'
      run: |
        mkdir android-recovery && cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        export GIT_TERMINAL_PROMPT=0

        if [ "${{ inputs.RECOVERY_TYPE }}" = "twrp" ]; then
          MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          BRANCH="twrp-${{ inputs.MANIFEST_BRANCH }}"
        elif [ "${{ inputs.RECOVERY_TYPE }}" = "pbrp" ]; then
          MANIFEST="https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
          BRANCH="android-${{ inputs.MANIFEST_BRANCH }}"
        elif [ "${{ inputs.RECOVERY_TYPE }}" = "shrp" ]; then
          MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          BRANCH="twrp-${{ inputs.MANIFEST_BRANCH }}"
        fi

        echo "Manifest: $MANIFEST | Branch: $BRANCH"
        repo init --depth=1 --partial-clone --clone-filter=blob:limit=10M --no-use-superproject -u "$MANIFEST" -b "$BRANCH"
        if repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (all)"
        elif repo sync -c -j2 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j2)"
        elif repo sync -c -j1 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j1)"
        else
          echo "SYNC FAILED"; exit 1
        fi

    # ============================================================
    # INIT + SYNC (OrangeFox)
    # ============================================================
    - name: Init + sync (OrangeFox)
      if: inputs.RECOVERY_TYPE == 'ofrp'
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${{ github.workspace }}/android-recovery
        cd ../android-recovery
        echo "OrangeFox synced."

    # ============================================================
    # GENERATE TREE
    # ============================================================
    - name: twrpdtgen → Generate tree
      if: inputs.TREE_GENERATOR == 'twrpdtgen'
      run: |
        if [ "${{ inputs.ANDROID_VERSION }}" -gt 12 ]; then
          echo "WARNING: twrpdtgen supports only Android 4.4–12."
          exit 1
        fi
        sudo pip3 install -q twrpdtgen gdown
        if [[ "${{ inputs.IMAGE_URL }}" == *"drive.google.com"* ]]; then
          gdown "${{ inputs.IMAGE_URL }}" -O stock.img
        else
          wget -q "${{ inputs.IMAGE_URL }}" -O stock.img
        fi
        python3 -m twrpdtgen stock.img -o generated_dt
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; | head -1)
        [ -z "$TREE" ] && { echo "twrpdtgen failed"; exit 1; }
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/
        echo "COMMIT_ID=Generated-by-twrpdtgen" >> $GITHUB_ENV

    - name: aospdtgen → Dump + generate tree
      if: inputs.TREE_GENERATOR == 'aospdtgen'
      run: |
        if [ "${{ inputs.ANDROID_VERSION }}" -lt 8 ]; then
          echo "WARNING: aospdtgen requires Treble (Android 8.0+)."
          exit 1
        fi
        sudo pip3 install -q dumpyara aospdtgen gdown
        if [[ "${{ inputs.FIRMWARE_URL }}" == *"drive.google.com"* ]]; then
          gdown "${{ inputs.FIRMWARE_URL }}" -O firmware.zip
        else
          wget -q "${{ inputs.FIRMWARE_URL }}" -O firmware.zip
        fi
        python3 -m dumpyara firmware.zip
        DUMP=$(find . -maxdepth 2 -name dump -type d | head -1)
        [ -z "$DUMP" ] && { echo "dumpyara failed"; exit 1; }
        python3 -m aospdtgen "$DUMP" -o generated_dt
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; | head -1)
        [ -z "$TREE" ] && { echo "aospdtgen failed"; exit 1; }
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/
        echo "COMMIT_ID=Generated-by-aospdtgen" >> $GITHUB_ENV

    - name: manual → Clone device tree
      if: inputs.TREE_GENERATOR == 'manual'
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.DEVICE_PATH }})
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

    # ============================================================
    # FIX DEVICE TREE (автопатчи под каждый recovery)
    # ============================================================
    - name: Fix device tree
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}

        if [ "${{ inputs.RECOVERY_TYPE }}" = "pbrp" ]; then
          PREFIX="omni"
          VENDOR_PATH="vendor/pb"
        else
          PREFIX="twrp"
          VENDOR_PATH="vendor/twrp"
        fi
        echo "Target prefix: $PREFIX | Vendor path: $VENDOR_PATH"

        find . -name "*.mk" -exec sed -i "s|vendor/omni/config/common.mk|${VENDOR_PATH}/config/common.mk|g" {} +
        find . -name "*.mk" -exec sed -i "s|vendor/lineage/config/common.mk|${VENDOR_PATH}/config/common.mk|g" {} +
        echo "Vendor path replaced -> ${VENDOR_PATH}"

        OLD_PRODUCT=""
        for f in omni_${{ inputs.DEVICE_NAME }}.mk lineage_${{ inputs.DEVICE_NAME }}.mk twrp_${{ inputs.DEVICE_NAME }}.mk; do
          if [ -f "$f" ]; then
            OLD_PRODUCT="$f"
            break
          fi
        done

        if [ -n "$OLD_PRODUCT" ]; then
          NEW_PRODUCT="${PREFIX}_${{ inputs.DEVICE_NAME }}.mk"
          if [ "$OLD_PRODUCT" != "$NEW_PRODUCT" ]; then
            mv "$OLD_PRODUCT" "$NEW_PRODUCT"
            echo "Renamed: $OLD_PRODUCT -> $NEW_PRODUCT"
            sed -i "s|$(basename $OLD_PRODUCT)|$NEW_PRODUCT|g" AndroidProducts.mk
            echo "AndroidProducts.mk updated"
          fi
        else
          echo "WARNING: No product makefile found"
        fi

        if [ -f "lineage.dependencies" ]; then
          mv "lineage.dependencies" "${PREFIX}.dependencies"
          echo "Renamed: lineage.dependencies -> ${PREFIX}.dependencies"
        fi

        if [ -f vendorsetup.sh ]; then
          rm -f vendorsetup.sh
          echo "Removed vendorsetup.sh"
        fi

        if ! grep -q "COMMON_LUNCH_CHOICES" AndroidProducts.mk 2>/dev/null; then
          echo "COMMON_LUNCH_CHOICES := ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng" >> AndroidProducts.mk
        fi
        echo "COMMON_LUNCH_CHOICES ensured"

        echo "=== Device tree fixed for ${{ inputs.RECOVERY_TYPE }} ==="
        cat AndroidProducts.mk

    # ============================================================
    # AUTO-RESOLVE MISSING DEPENDENCIES
    # ============================================================
    - name: Auto-resolve missing dependencies
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}

        # --- 0. Определяем ветку LineageOS под целевую версию Android ---
        case "${{ inputs.ANDROID_VERSION }}" in
          16) LOS_BRANCH="lineage-23.0" ;;
          15) LOS_BRANCH="lineage-22.0" ;;
          14) LOS_BRANCH="lineage-21.0" ;;
          13) LOS_BRANCH="lineage-20.0" ;;
          12) LOS_BRANCH="lineage-19.1" ;;
          11) LOS_BRANCH="lineage-18.1" ;;
          10) LOS_BRANCH="lineage-17.1" ;;
          9)  LOS_BRANCH="lineage-16.0" ;;
          *)  LOS_BRANCH="lineage-19.1" ;;
        esac
        echo "Using LineageOS branch for auto-clone: $LOS_BRANCH"

        # --- 1. Если есть файл зависимостей — парсим его ---
        DEP_FILE=""
        [ -f "lineage.dependencies" ] && DEP_FILE="lineage.dependencies"
        [ -f "twrp.dependencies" ] && DEP_FILE="twrp.dependencies"

        if [ -n "$DEP_FILE" ]; then
          echo "Found $DEP_FILE — cloning all listed dependencies..."
          export DEP_FILE
          python3 - <<'PYEOF'
        import json, subprocess, os
        dep_file = os.environ["DEP_FILE"]
        los_branch = os.environ.get("LOS_BRANCH", "lineage-19.1")
        with open(dep_file) as f:
            deps = json.load(f)
        for d in deps:
            repo = d.get("repository")
            path = d.get("target_path")
            branch = d.get("branch", los_branch)
            if not repo or not path:
                continue
            if os.path.isdir(path):
                print(f"  [skip] {path} already exists")
                continue
            url = f"https://github.com/{repo}.git"
            print(f"  [clone] {url} -> {path} ({branch})")
            os.makedirs(os.path.dirname(path), exist_ok=True)
            subprocess.run(
                ["git", "clone", "--depth=1", "-b", branch, url, path],
                check=False
            )
        PYEOF
          # Возвращаемся в корень android-recovery после клонирования
          cd android-recovery
          cd ${{ inputs.DEVICE_PATH }}
        fi

        # --- 2. Эвристика: ищем hardware/qcom-caf/... в .mk файлах ---
        echo "Scanning .mk files for missing hardware paths..."
        MISSING_PATHS=$(grep -rhoE 'hardware/qcom-caf/[a-zA-Z0-9_-]+' \
          --include='*.mk' . 2>/dev/null | sort -u || true)

        if [ -n "$MISSING_PATHS" ]; then
          echo "Found references:"
          echo "$MISSING_PATHS"
          for rel_path in $MISSING_PATHS; do
            FULL="../../$rel_path"
            if [ -d "$FULL" ]; then
              echo "  [skip] $rel_path already exists"
              continue
            fi

            if [ "$rel_path" = "hardware/qcom-caf/common" ]; then
              URL="https://github.com/LineageOS/android_hardware_qcom-caf_common.git"
              BRANCH="$LOS_BRANCH"
            else
              PLATFORM=$(basename "$rel_path")
              URL="https://github.com/LineageOS/android_hardware_qcom-caf_${PLATFORM}.git"
              BRANCH="$LOS_BRANCH"
              echo "  [guess] trying $URL ($BRANCH)"
            fi

            mkdir -p "$(dirname $FULL)"
            if git clone --depth=1 -b "$BRANCH" "$URL" "$FULL" 2>/dev/null; then
              echo "  [ok] cloned $rel_path"
            else
              echo "  [fail] could not clone $rel_path — add manually if needed"
            fi
          done
        else
          echo "No hardware/qcom-caf references found in .mk files."
        fi

        echo "=== Dependency resolution done ==="

    # ============================================================
    # PATCH BOARD CONFIG
    # ============================================================
    - name: Patch BoardConfig.mk
      env: { FLAGS: '${{ inputs.EXTRA_BUILD_FLAGS }}' }
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}
        printf '\n# --- Injected ---\n' >> BoardConfig.mk
        printf 'PLATFORM_VERSION := %s\n' "${{ inputs.ANDROID_VERSION }}" >> BoardConfig.mk
        printf 'ALLOW_MISSING_DEPENDENCIES := true\n' >> BoardConfig.mk

        if [ -n "${{ inputs.SCREEN_RESOLUTION }}" ]; then
          printf 'TARGET_SCREEN_WIDTH := %s\n'  "$(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f1)" >> BoardConfig.mk
          printf 'TARGET_SCREEN_HEIGHT := %s\n' "$(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f2)" >> BoardConfig.mk
        fi

        if [ "${{ inputs.IS_AB_DEVICE }}" = "true" ]; then
          printf 'BOARD_BUILD_SYSTEMROOT_IMAGE := true\n' >> BoardConfig.mk
          printf 'AB_OTA_UPDATER := true\n' >> BoardConfig.mk
        fi

        if [ -n "$FLAGS" ]; then
          printf '%s\n' "$FLAGS" >> BoardConfig.mk
        fi

        echo "=== BoardConfig.mk patched ==="
        tail -n 20 BoardConfig.mk

    - name: Clone kernel (optional)
      if: inputs.KERNEL_TREE != ''
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.KERNEL_PATH }})
        git clone ${{ inputs.KERNEL_TREE }} -b ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_PATH }} --depth=1

    # ============================================================
    # SCCACHE
    # ============================================================
    - name: Setup sccache
      if: ${{ fromJSON(inputs.ENABLE_SCCACHE) == true }}
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        variant: sccache
        max-size: 10G
        key: sccache-${{ inputs.DEVICE_NAME }}-${{ inputs.RECOVERY_TYPE }}-${{ inputs.MANIFEST_BRANCH }}
        restore-keys: sccache-${{ inputs.DEVICE_NAME }}-

    - name: Link ccache → sccache
      if: ${{ fromJSON(inputs.ENABLE_SCCACHE) == true }}
      run: |
        S=$(which sccache)
        sudo mkdir -p /usr/lib/ccache
        sudo ln -sf "$S" /usr/lib/ccache/ccache
        sudo ln -sf "$S" /usr/lib/ccache/gcc
        sudo ln -sf "$S" /usr/lib/ccache/g++

    # ============================================================
    # BUILD
    # ============================================================
    - name: Build
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ "${{ fromJSON(inputs.ENABLE_SCCACHE) }}" = "true" ]; then
          export USE_CCACHE=1
          export SCCACHE_DIR=$HOME/.cache/sccache
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          export PATH="/usr/lib/ccache:$PATH"
        fi
        MK=$(find ${{ inputs.DEVICE_PATH }} -maxdepth 1 -name "*_${{ inputs.DEVICE_NAME }}.mk" ! -name AndroidProducts.mk | head -1)
        PREFIX=$(basename "$MK" | sed "s/_${{ inputs.DEVICE_NAME }}\.mk//")
        echo "Detected prefix: $PREFIX"

        if [ "${{ inputs.RECOVERY_TYPE }}" = "pbrp" ]; then
          lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka pbrp
        elif [ "${{ inputs.RECOVERY_TYPE }}" = "ofrp" ]; then
          if [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && [ "${{ inputs.BUILD_TARGET }}" = "boot" ]; then
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd bootimage
          elif [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd vendorbootimage
          else
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd recoveryimage
          fi
        else
          lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka recoveryimage
        fi

    - name: Verify output
      run: |
        cd $OUT
        F=${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
        [ -s "$F" ] || { echo "Missing/empty: $F"; exit 1; }

    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: log-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/error*.log
          android-recovery/out/verbose.log
        retention-days: 7

    - uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.RECOVERY_TYPE }}-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        retention-days: 3

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: ${{ inputs.RECOVERY_TYPE }} ${{ inputs.DEVICE_NAME }} // A${{ inputs.ANDROID_VERSION }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ inputs.RECOVERY_TYPE }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        fail_on_unmatched_files: false
        body: |
          Recovery: ${{ inputs.RECOVERY_TYPE }}
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Generator: ${{ inputs.TREE_GENERATOR }}
          Android: ${{ inputs.ANDROID_VERSION }}
          Source: ${{ env.COMMIT_ID }}

    - name: Summary
      if: always()
      run: |
        {
          echo "### Recovery Build"
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Recovery | ${{ inputs.RECOVERY_TYPE }} |"
          echo "| Device | ${{ inputs.DEVICE_NAME }} |"
          echo "| Manifest | ${{ inputs.MANIFEST_BRANCH }} |"
          echo "| Generator | ${{ inputs.TREE_GENERATOR }} |"
          echo "| Android | ${{ inputs.ANDROID_VERSION }} |"
          echo "| Target | ${{ inputs.BUILD_TARGET }} |"
          echo "| Status | ${{ job.status }} |"
        } >> $GITHUB_STEP_SUMMARY
