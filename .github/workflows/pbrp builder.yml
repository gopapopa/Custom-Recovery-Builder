name: PBRP Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'android-11.0'
        type: choice
        options: [android-12.1, android-11.0]
      USE_TWRPDTGEN:
        description: 'Use twrpdtgen?'
        required: true
        type: boolean
        default: true
      IMAGE_URL:
        description: 'Stock image URL (twrpdtgen only)'
        required: false
        default: 'https://drive.google.com/file/d/1DRIzOP1YfPn4qTjr3n_GJRQlmoN1yjBa/view?usp=drivesdk'
      DEVICE_TREE:
        description: 'Device tree repo (manual only)'
        required: false
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: false
        default: 'Android-11'
      DEVICE_PATH:
        description: 'Device path (e.g. device/samsung/gtowifi)'
        required: true
        default: 'device/samsung/gtowifi'
      DEVICE_NAME:
        description: 'Codename (e.g. gtowifi)'
        required: true
        default: 'gtowifi'
      ANDROID_VERSION:
        description: 'Android version'
        required: true
        default: '11'
        type: choice
        options: ['14', '13', '12', '11', '10']
      SCREEN_RESOLUTION:
        description: 'Resolution WxH'
        required: true
        default: '1200x800'
      KERNEL_TREE:
        description: 'Kernel repo (optional)'
        required: false
        default: ''
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: false
        default: ''
      KERNEL_PATH:
        description: 'Kernel path'
        required: false
        default: ''
      ENABLE_CCACHE:
        description: 'Enable ccache?'
        required: true
        type: boolean
        default: true
      IS_AB_DEVICE:
        description: 'A/B device?'
        required: true
        type: boolean
        default: false
      EXTRA_BUILD_FLAGS:
        description: 'Extra BoardConfig.mk flags'
        required: false
        default: |
          TW_NO_TOUCH_WAIT_FOR_QCOM := true
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]
      LDCHECK:
        description: 'LDCheck blob path (blank=skip)'
        required: false
        default: ''

jobs:
  build:
    name: PBRP ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions: { contents: write }
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      BUILD_DATE: ${{ github.run_id }}
    steps:
    - uses: actions/checkout@v4

    - uses: rokibhasansagar/slimhub_actions@main

    - uses: pierotofy/set-swap-space@master
      with: { swap-size-gb: 24 }

    - name: Prepare environment
      run: |
        sudo apt update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt install -yqq \
          linux-modules-extra-$(uname -r) python3-pip cpio lz4 unzip gperf \
          gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev \
          lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential \
          libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ inputs.ANDROID_VERSION == '14' && '17' || '11' }}

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Init + sync
      run: |
        mkdir android-recovery && cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 300
        export GIT_TERMINAL_PROMPT=0
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree (manual)
      if: ${{ fromJSON(inputs.USE_TWRPDTGEN) == false }}
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.DEVICE_PATH }})
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

    - name: Generate tree (twrpdtgen)
      if: ${{ fromJSON(inputs.USE_TWRPDTGEN) == true }}
      run: |
        sudo pip3 install -q twrpdtgen gdown
        [[ "${{ inputs.IMAGE_URL }}" == *"drive.google.com"* ]] \
          && gdown "${{ inputs.IMAGE_URL }}" -O stock.img \
          || wget -q "${{ inputs.IMAGE_URL }}" -O stock.img
        python3 -m twrpdtgen stock.img -o generated_dt
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; | head -1)
        [ -z "$TREE" ] && { echo "twrpdtgen failed"; exit 1; }
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/
        echo "COMMIT_ID=Generated-by-twrpdtgen" >> $GITHUB_ENV

    - name: Clone kernel (optional)
      if: inputs.KERNEL_TREE != ''
      run: |
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.KERNEL_PATH }})
        git clone ${{ inputs.KERNEL_TREE }} -b ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_PATH }} --depth=1

    - name: Patch BoardConfig.mk
      env: { FLAGS: '${{ inputs.EXTRA_BUILD_FLAGS }}' }
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}
        {
          echo "# --- Injected ---"
          echo "PLATFORM_VERSION := ${{ inputs.ANDROID_VERSION }}"
          [ -n "${{ inputs.SCREEN_RESOLUTION }}" ] && {
            echo "TARGET_SCREEN_WIDTH := $(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f1)"
            echo "TARGET_SCREEN_HEIGHT := $(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f2)"
          }
          [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && {
            echo "BOARD_BUILD_SYSTEMROOT_IMAGE := true"
            echo "AB_OTA_UPDATER := true"
          }
          [ -n "$FLAGS" ] && printf '%s\n' "$FLAGS"
        } >> BoardConfig.mk
        tail -20 BoardConfig.mk

    - name: Detect makefile and lunch prefix
      run: |
        cd android-recovery
        MK=$(find ${{ inputs.DEVICE_PATH }} -maxdepth 1 -name "*_${{ inputs.DEVICE_NAME }}.mk" ! -name AndroidProducts.mk | head -1)
        [ -z "$MK" ] && { echo "No makefile for ${{ inputs.DEVICE_NAME }}"; exit 1; }
        PREFIX=$(basename "$MK" | sed "s/_${{ inputs.DEVICE_NAME }}\.mk//")
        echo "DEVICE_MAKEFILE=${PREFIX}_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        echo "Detected prefix: $PREFIX"

    - name: Fetch fonts
      continue-on-error: true
      run: |
        cd android-recovery
        mkdir -p external/noto-fonts/{other,others}
        wget -q --tries=3 https://github.com/cd-Crypton/custom-recovery-extras/raw/main/missing-font.zip -O f.zip \
          && unzip -oq f.zip -d external/noto-fonts/other/ \
          && cp -r external/noto-fonts/other/* external/noto-fonts/others/ 2>/dev/null
        rm -f f.zip

    - name: Setup ccache
      if: ${{ fromJSON(inputs.ENABLE_CCACHE) == true }}
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        max-size: 10G
        key: ccache-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}
        restore-keys: ccache-${{ inputs.DEVICE_NAME }}-

    - name: Build
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        [ "${{ fromJSON(inputs.ENABLE_CCACHE) }}" = "true" ] && { export USE_CCACHE=1 CCACHE_EXEC=$(which ccache) CCACHE_DIR=$HOME/.ccache; }
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && mka pbrp

    - name: Verify output
      run: |
        cd $OUT
        F=${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
        [ -s "$F" ] || { echo "Missing/empty: $F"; exit 1; }
        echo "OK: $F ($(du -h $F | cut -f1))"

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: log-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/error*.log
          android-recovery/out/verbose.log
        retention-days: 7

    - uses: actions/upload-artifact@v4
      with:
        name: PBRP-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/PBRP*.zip
        retention-days: 3

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/PBRP*.zip
        name: PBRP ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: pbrp-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        fail_on_unmatched_files: false
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Tree: ${{ inputs.USE_TWRPDTGEN == 'true' && 'twrpdtgen' || 'Manual' }}
          Source: ${{ inputs.USE_TWRPDTGEN == 'true' && inputs.IMAGE_URL || env.COMMIT_ID }}

    - name: LDCheck
      if: inputs.LDCHECK != ''
      continue-on-error: true
      run: |
        [ -f tools/ldcheck ] || { echo "ldcheck not found"; exit 0; }
        D=$OUT/recovery/root
        mv -n tools/libneeds tools/ldcheck $D/ 2>/dev/null || true
        cd $D
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECK }}

    - name: Summary
      if: always()
      run: |
        {
          echo "### PBRP Build"
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Device | ${{ inputs.DEVICE_NAME }} |"
          echo "| Manifest | ${{ inputs.MANIFEST_BRANCH }} |"
          echo "| Target | ${{ inputs.BUILD_TARGET }} |"
          echo "| A/B | ${{ inputs.IS_AB_DEVICE }} |"
          echo "| Status | ${{ job.status }} |"
        } >> $GITHUB_STEP_SUMMARY
