name: Recovery Builder (TWRP / PBRP / SHRP / OFRP)

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Recovery Type'
        required: true
        default: 'twrp'
        type: choice
        options: [twrp, pbrp, shrp, ofrp]
      MANIFEST_BRANCH:
        description: 'Manifest Branch (version)'
        required: true
        default: '12.1'
        type: choice
        options: ['14.1', '13.0', '12.1', '11.0', '10.0', '9.0']
      TREE_GENERATOR:
        description: 'Tree Generator'
        required: true
        default: 'manual'
        type: choice
        options: [manual, twrpdtgen, aospdtgen]
      ANDROID_VERSION:
        description: 'Target Android Version'
        required: true
        default: '12'
        type: choice
        options: ['16', '15', '14', '13', '12', '11', '10', '9']
      IMAGE_URL:
        description: 'boot/recovery.img URL (twrpdtgen only)'
        required: false
        default: ''
      FIRMWARE_URL:
        description: 'Full firmware URL (aospdtgen only)'
        required: false
        default: ''
      DEVICE_TREE:
        description: 'Device tree repo (manual only)'
        required: false
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: false
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device path'
        required: true
        default: 'device/samsung/gtowifi'
      DEVICE_NAME:
        description: 'Codename'
        required: true
        default: 'gtowifi'
      SCREEN_RESOLUTION:
        description: 'Resolution WxH'
        required: true
        default: '1200x800'
      KERNEL_TREE:
        description: 'Kernel repo (optional)'
        required: false
        default: ''
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: false
        default: ''
      KERNEL_PATH:
        description: 'Kernel path'
        required: false
        default: ''
      ENABLE_SCCACHE:
        description: 'Enable sccache?'
        required: true
        type: boolean
        default: true
      IS_AB_DEVICE:
        description: 'A/B device?'
        required: true
        type: boolean
        default: false
      EXTRA_BUILD_FLAGS:
        description: 'Extra BoardConfig.mk flags (manual, one per line)'
        required: false
        default: ''
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]

jobs:
  build:
    name: ${{ inputs.RECOVERY_TYPE }} ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions: { contents: write }
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      BUILD_DATE: ${{ github.run_number }}
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v5

    - uses: rokibhasansagar/slimhub_actions@main

    - uses: pierotofy/set-swap-space@master
      with: { swap-size-gb: 32 }

    - name: Prepare environment
      run: |
        set +e
        sudo apt update -qq || true
        DEBIAN_FRONTEND=noninteractive sudo apt install -yqq \
          linux-modules-extra-$(uname -r) python3-pip cpio lz4 unzip gperf \
          gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev \
          lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential \
          libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libncurses6 python3 tar erofs-utils || true
        sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo || true
        chmod a+x ~/bin/repo || true
        sudo ln -sf ~/bin/repo /usr/bin/repo || true
        echo "=== Environment preparation completed ==="

    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: ${{ (inputs.ANDROID_VERSION == '14' || inputs.ANDROID_VERSION == '15' || inputs.ANDROID_VERSION == '16') && '17' || '11' }}

    - name: Init + sync (repo-based)
      if: inputs.RECOVERY_TYPE != 'ofrp'
      run: |
        set +e
        mkdir -p android-recovery && cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        export GIT_TERMINAL_PROMPT=0

        case "${{ inputs.RECOVERY_TYPE }}" in
          twrp)
            MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            BRANCH="twrp-${{ inputs.MANIFEST_BRANCH }}"
            ;;
          pbrp)
            MANIFEST="https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
            BRANCH="android-${{ inputs.MANIFEST_BRANCH }}"
            ;;
          shrp)
            MANIFEST="https://github.com/SHRP/manifest.git"
            BRANCH="v3_11.0"
            ;;
        esac

        echo "Manifest: $MANIFEST | Branch: $BRANCH"
        repo init --depth=1 --no-use-superproject -u "$MANIFEST" -b "$BRANCH" || true

        rm -f .repo/local_manifests/roomservice.xml 2>/dev/null || true
        mkdir -p .repo/local_manifests
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<manifest>' \
          '  <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />' \
          '  <project name="LineageOS/android_kernel_samsung_sdm429" path="kernel/samsung/sdm429" remote="github" revision="lineage-18.1" />' \
          '</manifest>' > .repo/local_manifests/gtowifi_fix.xml
        echo "Created local_manifests/gtowifi_fix.xml"

        if repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (all)"
        elif repo sync -c -j2 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j2)"
        elif repo sync -c -j1 --force-sync --no-clone-bundle --no-tags; then
          echo "Sync OK (j1)"
        else
          echo "SYNC FAILED — continuing with partial source"
        fi
        [ -d ".repo" ] || { echo "Repo init failed completely"; exit 1; }

    - name: Init + sync (OrangeFox)
      if: inputs.RECOVERY_TYPE == 'ofrp'
      run: |
        set +e
        git clone https://gitlab.com/OrangeFox/sync.git || true
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} \
          --path ${{ github.workspace }}/android-recovery || true
        cd ../android-recovery || true
        echo "OrangeFox synced."

    - name: twrpdtgen → Generate tree
      if: inputs.TREE_GENERATOR == 'twrpdtgen'
      run: |
        set +e
        if [ "${{ inputs.ANDROID_VERSION }}" -gt 12 ]; then
          echo "WARNING: twrpdtgen supports only Android 4.4–12. Skipping."
          exit 0
        fi
        sudo pip3 install -q twrpdtgen gdown || true
        if [[ "${{ inputs.IMAGE_URL }}" == *"drive.google.com"* ]]; then
          gdown "${{ inputs.IMAGE_URL }}" -O stock.img || true
        else
          wget -q "${{ inputs.IMAGE_URL }}" -O stock.img || true
        fi
        python3 -m twrpdtgen stock.img -o generated_dt || true
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; 2>/dev/null | head -1)
        if [ -z "$TREE" ]; then
          echo "twrpdtgen failed — aborting"
          exit 1
        fi
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/ || true
        echo "COMMIT_ID=Generated-by-twrpdtgen" >> $GITHUB_ENV

    - name: aospdtgen → Dump + generate tree
      if: inputs.TREE_GENERATOR == 'aospdtgen'
      run: |
        set +e
        if [ "${{ inputs.ANDROID_VERSION }}" -lt 8 ]; then
          echo "WARNING: aospdtgen requires Treble (Android 8.0+). Skipping."
          exit 0
        fi
        sudo pip3 install -q dumpyara aospdtgen gdown || true
        if [[ "${{ inputs.FIRMWARE_URL }}" == *"drive.google.com"* ]]; then
          gdown "${{ inputs.FIRMWARE_URL }}" -O firmware.zip || true
        else
          wget -q "${{ inputs.FIRMWARE_URL }}" -O firmware.zip || true
        fi
        python3 -m dumpyara firmware.zip || true
        DUMP=$(find . -maxdepth 2 -name dump -type d 2>/dev/null | head -1)
        if [ -z "$DUMP" ]; then
          echo "dumpyara failed — aborting"
          exit 1
        fi
        python3 -m aospdtgen "$DUMP" -o generated_dt || true
        TREE=$(find generated_dt -name AndroidProducts.mk -exec dirname {} \; 2>/dev/null | head -1)
        if [ -z "$TREE" ]; then
          echo "aospdtgen failed — aborting"
          exit 1
        fi
        mkdir -p android-recovery/${{ inputs.DEVICE_PATH }}
        cp -r $TREE/* android-recovery/${{ inputs.DEVICE_PATH }}/ || true
        echo "COMMIT_ID=Generated-by-aospdtgen" >> $GITHUB_ENV

    - name: manual → Clone device tree
      if: inputs.TREE_GENERATOR == 'manual'
      run: |
        set +e
        cd android-recovery
        mkdir -p $(dirname ${{ inputs.DEVICE_PATH }}) || true
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ${{ inputs.DEVICE_PATH }} || true
        if [ -d "${{ inputs.DEVICE_PATH }}/.git" ]; then
          echo "COMMIT_ID=$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV
        else
          echo "COMMIT_ID=manual-clone-failed" >> $GITHUB_ENV
          echo "ERROR: Device tree clone failed"
          exit 1
        fi

    - name: Verify device tree exists
      run: |
        if [ ! -d "android-recovery/${{ inputs.DEVICE_PATH }}" ] || \
           [ -z "$(ls -A android-recovery/${{ inputs.DEVICE_PATH }} 2>/dev/null)" ]; then
          echo "ERROR: DEVICE_PATH is empty or missing"
          exit 1
        fi
        echo "Device tree verified: android-recovery/${{ inputs.DEVICE_PATH }}"

    - name: Fix device tree
      run: |
        set +e
        cd android-recovery/${{ inputs.DEVICE_PATH }} || exit 1

        case "${{ inputs.RECOVERY_TYPE }}" in
          pbrp) PREFIX="pbrp"; VENDOR_PATH="vendor/pb" ;;
          shrp) PREFIX="omni"; VENDOR_PATH="vendor/shrp" ;;
          *)    PREFIX="twrp"; VENDOR_PATH="vendor/twrp" ;;
        esac
        echo "Target prefix: $PREFIX | Vendor path: $VENDOR_PATH"

        find . -name "*.mk" -exec sed -i \
          "s|vendor/omni/config/common.mk|${VENDOR_PATH}/config/common.mk|g" {} + 2>/dev/null || true
        find . -name "*.mk" -exec sed -i \
          "s|vendor/lineage/config/common.mk|${VENDOR_PATH}/config/common.mk|g" {} + 2>/dev/null || true
        echo "Vendor path replaced -> ${VENDOR_PATH}"

        OLD_PRODUCT=""
        for f in omni_${{ inputs.DEVICE_NAME }}.mk \
                 lineage_${{ inputs.DEVICE_NAME }}.mk \
                 twrp_${{ inputs.DEVICE_NAME }}.mk \
                 pbrp_${{ inputs.DEVICE_NAME }}.mk; do
          if [ -f "$f" ]; then
            OLD_PRODUCT="$f"
            break
          fi
        done

        if [ -n "$OLD_PRODUCT" ]; then
          NEW_PRODUCT="${PREFIX}_${{ inputs.DEVICE_NAME }}.mk"
          if [ "$OLD_PRODUCT" != "$NEW_PRODUCT" ]; then
            mv "$OLD_PRODUCT" "$NEW_PRODUCT" 2>/dev/null || true
            echo "Renamed: $OLD_PRODUCT -> $NEW_PRODUCT"
            sed -i "s|$(basename $OLD_PRODUCT)|$NEW_PRODUCT|g" \
              AndroidProducts.mk 2>/dev/null || true
            echo "AndroidProducts.mk updated"
          fi
        else
          echo "WARNING: No product makefile found — continuing"
        fi

        if [ -f "lineage.dependencies" ]; then
          mv "lineage.dependencies" "${PREFIX}.dependencies" 2>/dev/null || true
          echo "Renamed: lineage.dependencies -> ${PREFIX}.dependencies"
        fi

        if [ -f vendorsetup.sh ]; then
          rm -f vendorsetup.sh && echo "Removed vendorsetup.sh" || true
        fi

        if ! grep -q "COMMON_LUNCH_CHOICES" AndroidProducts.mk 2>/dev/null; then
          echo "COMMON_LUNCH_CHOICES := ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng" \
            >> AndroidProducts.mk || true
        fi
        echo "COMMON_LUNCH_CHOICES ensured"

        echo "=== Device tree fixed for ${{ inputs.RECOVERY_TYPE }} ==="
        cat AndroidProducts.mk || true

    - name: Auto-resolve missing dependencies
      run: |
        set +e
        cd android-recovery/${{ inputs.DEVICE_PATH }} || exit 1

        case "${{ inputs.ANDROID_VERSION }}" in
          16) LOS_BRANCH="lineage-23.0"; ALT_BRANCHES="lineage-22.2 lineage-22.1 lineage-22.0" ;;
          15) LOS_BRANCH="lineage-22.2"; ALT_BRANCHES="lineage-22.1 lineage-22.0 lineage-21.0" ;;
          14) LOS_BRANCH="lineage-21.0"; ALT_BRANCHES="lineage-20.0 lineage-19.1" ;;
          13) LOS_BRANCH="lineage-20.0"; ALT_BRANCHES="lineage-19.1 lineage-18.1" ;;
          12) LOS_BRANCH="lineage-19.1"; ALT_BRANCHES="lineage-18.1 lineage-17.1" ;;
          11) LOS_BRANCH="lineage-18.1"; ALT_BRANCHES="lineage-17.1 lineage-16.0" ;;
          10) LOS_BRANCH="lineage-17.1"; ALT_BRANCHES="lineage-16.0 lineage-15.1" ;;
          9)  LOS_BRANCH="lineage-16.0"; ALT_BRANCHES="lineage-15.1 lineage-14.1" ;;
          *)  LOS_BRANCH="lineage-22.2"; ALT_BRANCHES="lineage-22.1 lineage-22.0 lineage-21.0" ;;
        esac
        echo "Primary LOS branch: $LOS_BRANCH | Fallbacks: $ALT_BRANCHES"
        export LOS_BRANCH ALT_BRANCHES

        if [ -f ".repo/local_manifests/roomservice.xml" ]; then
          echo "Removing roomservice.xml to avoid missing-repo sync errors..."
          rm -f ".repo/local_manifests/roomservice.xml" || true
        fi

        DEP_FILE=""
        for f in lineage.dependencies twrp.dependencies omni.dependencies pbrp.dependencies; do
          [ -f "$f" ] && DEP_FILE="$f" && break
        done

        if [ -n "$DEP_FILE" ]; then
          echo "Found $DEP_FILE — resolving dependencies..."
          export DEP_FILE
          python3 - <<'PYEOF'
        import json, subprocess, os

        dep_file = os.environ["DEP_FILE"]
        los_branch = os.environ["LOS_BRANCH"]
        alt_branches = os.environ.get("ALT_BRANCHES", "").split()

        FALLBACK_ORGS = [None, "LineageOS", "TeamWin", "omnirom"]

        def try_clone(repo, path, branch):
            repo_name = repo.split("/")[-1]
            branches_to_try = [branch] + alt_branches
            for b in branches_to_try:
                for org in FALLBACK_ORGS:
                    if org is None:
                        url = f"https://github.com/{repo}.git"
                    else:
                        url = f"https://github.com/{org}/{repo_name}.git"
                    print(f"  [try] {url} -> {path} ({b})")
                    os.makedirs(os.path.dirname(path), exist_ok=True)
                    res = subprocess.run(
                        ["git", "clone", "--depth=1", "-b", b, url, path],
                        capture_output=True, text=True,
                    )
                    if res.returncode == 0:
                        print(f"    [ok] cloned from {org or repo.split('/')[0]} ({b})")
                        return True
                    if os.path.isdir(path):
                        subprocess.run(["rm", "-rf", path], check=False)
            print(f"    [fail] could not clone {repo}")
            return False

        with open(dep_file) as f:
            deps = json.load(f)

        for d in deps:
            repo = d.get("repository")
            path = d.get("target_path")
            branch = d.get("branch", los_branch)
            if not repo or not path:
                continue
            if os.path.isdir(path) and os.listdir(path):
                print(f"  [skip] {path} already exists")
                continue
            try_clone(repo, path, branch)
        PYEOF
          cd android-recovery 2>/dev/null || true
          cd ${{ inputs.DEVICE_PATH }} 2>/dev/null || true
        fi

        echo "Scanning .mk files for missing hardware paths..."
        MISSING_PATHS=$(grep -rhoE 'hardware/qcom-caf/[a-zA-Z0-9_-]+' \
          --include='*.mk' . 2>/dev/null | sort -u || true)

        if [ -n "$MISSING_PATHS" ]; then
          echo "Found references:"
          echo "$MISSING_PATHS"
          for rel_path in $MISSING_PATHS; do
            FULL="../../$rel_path"
            if [ -d "$FULL" ] && [ -n "$(ls -A $FULL 2>/dev/null)" ]; then
              echo "  [skip] $rel_path already exists"
              continue
            fi
            if [ "$rel_path" = "hardware/qcom-caf/common" ]; then
              URL="https://github.com/LineageOS/android_hardware_qcom-caf_common.git"
            else
              PLATFORM=$(basename "$rel_path")
              URL="https://github.com/LineageOS/android_hardware_qcom-caf_${PLATFORM}.git"
            fi
            mkdir -p "$(dirname $FULL)" || true
            CLONED=0
            for b in "$LOS_BRANCH" $ALT_BRANCHES; do
              if git clone --depth=1 -b "$b" "$URL" "$FULL" 2>/dev/null; then
                echo "  [ok] cloned $rel_path ($b)"
                CLONED=1
                break
              fi
              rm -rf "$FULL" 2>/dev/null || true
            done
            if [ "$CLONED" = "0" ]; then
              echo "  [fail] could not clone $rel_path (continuing)"
            fi
          done
        fi

        NON_AB_URLS=(
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-23.0/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-22.2/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-22.1/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-22.0/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-21.0/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-20.0/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-19.1/target/product/non_ab_device.mk"
          "https://raw.githubusercontent.com/LineageOS/android_build/lineage-18.1/target/product/non_ab_device.mk"
        )

        TARGET_DIR="../../build/make/target/product"
        if [ ! -f "$TARGET_DIR/non_ab_device.mk" ]; then
          echo "Downloading real non_ab_device.mk from LineageOS..."
          mkdir -p "$TARGET_DIR" || true
          DOWNLOADED=0
          for url in "${NON_AB_URLS[@]}"; do
            echo "  [try] $url"
            if curl -sSL -o "$TARGET_DIR/non_ab_device.mk" "$url" 2>/dev/null; then
              if [ -s "$TARGET_DIR/non_ab_device.mk" ] && \
                 ! grep -q "<!DOCTYPE html>" "$TARGET_DIR/non_ab_device.mk" 2>/dev/null && \
                 grep -q "PRODUCT_PACKAGES" "$TARGET_DIR/non_ab_device.mk" 2>/dev/null; then
                echo "  [ok] downloaded non_ab_device.mk ($(wc -l < "$TARGET_DIR/non_ab_device.mk") lines, $(stat -c%s "$TARGET_DIR/non_ab_device.mk") bytes)"
                DOWNLOADED=1
                break
              else
                echo "  [skip] invalid content from this URL"
                rm -f "$TARGET_DIR/non_ab_device.mk"
              fi
            fi
          done
          if [ "$DOWNLOADED" = "0" ]; then
            echo "  [fail] could not download non_ab_device.mk from any URL"
            echo "  [fallback] creating minimal valid file (identical to LineageOS original)"
            printf '# Packages to update the recovery partition, which will be installed on\n' \
              > "$TARGET_DIR/non_ab_device.mk"
            printf '# /vendor. Dont install these unless theyre needed.\n' \
              >> "$TARGET_DIR/non_ab_device.mk"
            printf 'PRODUCT_PACKAGES += \\\\\n    applypatch\n' \
              >> "$TARGET_DIR/non_ab_device.mk"
          fi
        else
          echo "non_ab_device.mk already exists (size: $(stat -c%s "$TARGET_DIR/non_ab_device.mk") bytes)"
        fi

        if [ "${{ inputs.IS_AB_DEVICE }}" = "true" ]; then
          AB_URLS=(
            "https://raw.githubusercontent.com/LineageOS/android_build/lineage-22.2/target/product/virtual_ab_device.mk"
            "https://raw.githubusercontent.com/LineageOS/android_build/lineage-22.0/target/product/virtual_ab_device.mk"
            "https://raw.githubusercontent.com/LineageOS/android_build/lineage-21.0/target/product/virtual_ab_device.mk"
          )
          if [ ! -f "$TARGET_DIR/virtual_ab_device.mk" ]; then
            echo "Downloading virtual_ab_device.mk (A/B device)..."
            for url in "${AB_URLS[@]}"; do
              if curl -sSL -o "$TARGET_DIR/virtual_ab_device.mk" "$url" 2>/dev/null && \
                 [ -s "$TARGET_DIR/virtual_ab_device.mk" ] && \
                 ! grep -q "<!DOCTYPE html>" "$TARGET_DIR/virtual_ab_device.mk" 2>/dev/null; then
                echo "  [ok] downloaded virtual_ab_device.mk"
                break
              fi
              rm -f "$TARGET_DIR/virtual_ab_device.mk" 2>/dev/null || true
            done
          fi
        fi

        cd ../../ || true

        if [ ! -d "hardware/samsung" ] || [ -z "$(ls -A hardware/samsung 2>/dev/null)" ]; then
          echo "Cloning hardware/samsung from LineageOS..."
          rm -rf hardware/samsung 2>/dev/null || true
          for b in "$LOS_BRANCH" $ALT_BRANCHES; do
            if git clone --depth=1 -b "$b" \
              https://github.com/LineageOS/android_hardware_samsung.git \
              hardware/samsung 2>/dev/null; then
              echo "  [ok] hardware/samsung ($b)"
              break
            fi
            rm -rf hardware/samsung 2>/dev/null || true
          done
        else
          echo "hardware/samsung already exists"
        fi

        if [ ! -d "kernel/samsung/sdm429" ] || [ -z "$(ls -A kernel/samsung/sdm429 2>/dev/null)" ]; then
          echo "Cloning kernel/samsung/sdm429 from LineageOS..."
          mkdir -p kernel/samsung || true
          rm -rf kernel/samsung/sdm429 2>/dev/null || true
          for b in "$LOS_BRANCH" $ALT_BRANCHES; do
            if git clone --depth=1 -b "$b" \
              https://github.com/LineageOS/android_kernel_samsung_sdm429.git \
              kernel/samsung/sdm429 2>/dev/null; then
              echo "  [ok] kernel/samsung/sdm429 ($b)"
              break
            fi
            rm -rf kernel/samsung/sdm429 2>/dev/null || true
          done
        else
          echo "kernel/samsung/sdm429 already exists"
        fi

        cd ${{ inputs.DEVICE_PATH }} 2>/dev/null || true

        echo "=== Dependency resolution done (real files, not stubs) ==="

    - name: Patch BoardConfig.mk
      env: { FLAGS: '${{ inputs.EXTRA_BUILD_FLAGS }}' }
      run: |
        set +e
        cd android-recovery/${{ inputs.DEVICE_PATH }} || exit 1
        {
          printf '\n# --- Injected ---\n'
          printf 'PLATFORM_VERSION := %s\n' "${{ inputs.ANDROID_VERSION }}"
          printf 'ALLOW_MISSING_DEPENDENCIES := true\n'
          if [ -n "${{ inputs.SCREEN_RESOLUTION }}" ]; then
            W=$(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f1)
            H=$(echo ${{ inputs.SCREEN_RESOLUTION }} | cut -dx -f2)
            printf 'TARGET_SCREEN_WIDTH := %s\n'  "$W"
            printf 'TARGET_SCREEN_HEIGHT := %s\n' "$H"
          fi
          if [ "${{ inputs.IS_AB_DEVICE }}" = "true" ]; then
            printf 'BOARD_BUILD_SYSTEMROOT_IMAGE := true\n'
            printf 'AB_OTA_UPDATER := true\n'
          fi
          if [ -n "$FLAGS" ]; then
            printf '%s\n' "$FLAGS"
          fi
        } >> BoardConfig.mk || true
        echo "=== BoardConfig.mk patched ==="
        tail -n 20 BoardConfig.mk || true

    - name: Clone kernel (optional)
      if: inputs.KERNEL_TREE != ''
      run: |
        set +e
        cd android-recovery
        if [ -z "${{ inputs.KERNEL_PATH }}" ]; then
          echo "ERROR: KERNEL_PATH is empty but KERNEL_TREE is set"
          exit 1
        fi
        mkdir -p $(dirname ${{ inputs.KERNEL_PATH }}) || true
        git clone ${{ inputs.KERNEL_TREE }} -b ${{ inputs.KERNEL_BRANCH }} \
          ${{ inputs.KERNEL_PATH }} --depth=1 || true
        if [ -d "${{ inputs.KERNEL_PATH }}/.git" ]; then
          echo "Kernel cloned successfully"
        else
          echo "Kernel clone failed — continuing"
        fi

    - name: Setup sccache
      if: inputs.ENABLE_SCCACHE
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        variant: sccache
        max-size: 10G
        key: sccache-${{ inputs.DEVICE_NAME }}-${{ inputs.RECOVERY_TYPE }}-${{ inputs.MANIFEST_BRANCH }}
        restore-keys: sccache-${{ inputs.DEVICE_NAME }}-

    - name: Link ccache → sccache
      if: inputs.ENABLE_SCCACHE
      run: |
        set +e
        S=$(which sccache 2>/dev/null)
        if [ -n "$S" ]; then
          sudo mkdir -p /usr/lib/ccache || true
          sudo ln -sf "$S" /usr/lib/ccache/ccache || true
          sudo ln -sf "$S" /usr/lib/ccache/gcc || true
          sudo ln -sf "$S" /usr/lib/ccache/g++ || true
          echo "sccache linked"
        else
          echo "sccache not found — continuing without ccache"
        fi

    - name: Build
      run: |
        set +e
        cd android-recovery || exit 1
        source build/envsetup.sh 2>/dev/null || true
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ "${{ inputs.ENABLE_SCCACHE }}" = "true" ]; then
          export USE_CCACHE=1
          export SCCACHE_DIR=$HOME/.cache/sccache
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          export PATH="/usr/lib/ccache:$PATH"
        fi
        MK=$(find ${{ inputs.DEVICE_PATH }} -maxdepth 1 \
          -name "*_${{ inputs.DEVICE_NAME }}.mk" \
          ! -name AndroidProducts.mk 2>/dev/null | head -1)
        if [ -z "$MK" ]; then
          echo "ERROR: No product makefile found — cannot determine prefix"
          exit 1
        fi
        PREFIX=$(basename "$MK" | sed "s/_${{ inputs.DEVICE_NAME }}\.mk//")
        echo "Detected prefix: $PREFIX"

        if [ "${{ inputs.RECOVERY_TYPE }}" = "pbrp" ]; then
          lunch pbrp_${{ inputs.DEVICE_NAME }}-eng && mka recoveryimage
        elif [ "${{ inputs.RECOVERY_TYPE }}" = "shrp" ]; then
          lunch omni_${{ inputs.DEVICE_NAME }}-eng && mka recoveryimage
        elif [ "${{ inputs.RECOVERY_TYPE }}" = "ofrp" ]; then
          if [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && [ "${{ inputs.BUILD_TARGET }}" = "boot" ]; then
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd bootimage
          elif [ "${{ inputs.IS_AB_DEVICE }}" = "true" ] && [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd vendorbootimage
          else
            lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka adbd recoveryimage
          fi
        else
          lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng && mka recoveryimage
        fi
        BUILD_EXIT=$?
        echo "Build exited with code: $BUILD_EXIT"
        exit $BUILD_EXIT

    - name: Verify output
      run: |
        set +e
        cd "${{ env.OUT }}" || exit 1
        case "${{ inputs.BUILD_TARGET }}" in
          boot)       F="boot.img" ;;
          vendorboot) F="vendor_boot.img" ;;
          *)          F="recovery.img" ;;
        esac
        if [ -s "$F" ]; then
          echo "Output verified: $F ($(stat -c%s "$F") bytes)"
        else
          echo "Missing/empty: $F"
          ls -la || true
          exit 1
        fi

    - name: Collect diagnostics
      if: failure()
      run: |
        set +e
        echo "=== Collecting diagnostics ==="
        find android-recovery -name "error*.log" -o -name "verbose.log" 2>/dev/null | head -20
        echo "=== BoardConfig.mk (tail) ==="
        tail -n 40 android-recovery/${{ inputs.DEVICE_PATH }}/BoardConfig.mk 2>/dev/null || true
        echo "=== AndroidProducts.mk ==="
        cat android-recovery/${{ inputs.DEVICE_PATH }}/AndroidProducts.mk 2>/dev/null || true
        echo "=== Available .mk files ==="
        find android-recovery/${{ inputs.DEVICE_PATH }} -name "*.mk" 2>/dev/null || true
        echo "=== non_ab_device.mk (if exists) ==="
        cat android-recovery/build/make/target/product/non_ab_device.mk 2>/dev/null || true

    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: log-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/error*.log
          android-recovery/out/verbose.log
          android-recovery/${{ inputs.DEVICE_PATH }}/BoardConfig.mk
          android-recovery/${{ inputs.DEVICE_PATH }}/AndroidProducts.mk
        retention-days: 7
        if-no-files-found: warn

    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: ${{ inputs.RECOVERY_TYPE }}-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        retention-days: 3
        if-no-files-found: warn

    - uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET == 'vendorboot' && 'vendor_boot.img' || format('{0}.img', inputs.BUILD_TARGET) }}
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: ${{ inputs.RECOVERY_TYPE }} ${{ inputs.DEVICE_NAME }} // A${{ inputs.ANDROID_VERSION }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ inputs.RECOVERY_TYPE }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        fail_on_unmatched_files: false
        body: |
          Recovery: ${{ inputs.RECOVERY_TYPE }}
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Generator: ${{ inputs.TREE_GENERATOR }}
          Android: ${{ inputs.ANDROID_VERSION }}
          Source: ${{ env.COMMIT_ID }}

    - name: Summary
      if: always()
      run: |
        set +e
        {
          echo "### Recovery Build"
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Recovery | ${{ inputs.RECOVERY_TYPE }} |"
          echo "| Device | ${{ inputs.DEVICE_NAME }} |"
          echo "| Manifest | ${{ inputs.MANIFEST_BRANCH }} |"
          echo "| Generator | ${{ inputs.TREE_GENERATOR }} |"
          echo "| Android | ${{ inputs.ANDROID_VERSION }} |"
          echo "| Target | ${{ inputs.BUILD_TARGET }} |"
          echo "| Status | ${{ job.status }} |"
        } >> $GITHUB_STEP_SUMMARY
